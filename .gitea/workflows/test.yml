# #208: CI — run the executable suite and the DSH size guard on every push/PR.
# #252: push is limited to main. With a PR open, a branch push started a second
# run of the same commit, and two concurrent runs race for the runner's shared
# act action cache (/root/.cache/act), leaving one red before any test runs.
# The workflow-wide concurrency group serializes runs for the same reason.
name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: dsh-vision-bridge-ci
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install system tools used by tests (pdftoppm, pdftotext, ffmpeg)
        run: |
          # The runner's act container is root and ships no sudo, so only use it
          # when we are actually unprivileged. poppler-utils stays mandatory:
          # test/routes.smoke.test.js needs a real pdftoppm to get 422, not 500.
          # ffmpeg is required as well: test/attach-execute.test.js samples real
          # frames, and would otherwise silently skip in CI (#257).
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends poppler-utils ffmpeg
          pdftoppm -v
      - name: install dependencies (peers resolve automatically)
        run: npm install --no-audit --no-fund
      - name: syntax check
        run: node --check lib/index.js && node --check lib/vision-core.js && node --check lib/channels.js && node --check lib/client.js
      - name: unit and smoke tests
        run: npm test
      - name: package size guard (DSH store limit 262144 bytes/file)
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const data = JSON.parse(require("fs").readFileSync("pack.json", "utf8"));
            const bad = (data[0].files || []).filter((f) => f.size > 262144);
            for (const f of bad) console.error("BLOCKED", f.size, f.path);
            process.exit(bad.length ? 1 : 0);
          '
